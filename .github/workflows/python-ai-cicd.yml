name: Python AI Code build and push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # required to push to CD repo with GITHUB_TOKEN or PAT

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ./python-AI
        run: |
          pip install -r requirements.txt
        
      - name: Run Tests
        run: |
          python -m pytest || [ $? -eq 5 ]

  build_backend_docker_image_and_push:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DCOKER_USERNAME }}
          password: ${{ secrets.DCOKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
       
      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: ./python-AI
          file: ./python-AI/Dockerfile
          push: true
          tags: |
            sadique167/pythonai:latest
            sadique167/pythonai:${{ env.IMAGE_TAG }}
